<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screening Checklist - Pristin Healthcare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            background: var(--bg-primary);
        }

        .checklist-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }

        .checklist-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-tertiary);
            font-weight: 600;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--bg-primary);
        }

        .checklist-section {
            display: none;
        }

        .checklist-section.active {
            display: block;
        }

        .checklist-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: 1rem;
        }

        .checklist-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checkbox-custom {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .checkbox-custom.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .checkbox-custom i {
            color: var(--bg-primary);
            font-size: 0.75rem;
            display: none;
        }

        .checkbox-custom.checked i {
            display: block;
        }

        .item-text {
            color: var(--text-primary);
            flex: 1;
        }

        .item-text.completed {
            text-decoration: line-through;
            color: var(--text-tertiary);
        }

        .severity-select {
            padding: 0.25rem 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.75rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.8125rem;
            color: var(--text-tertiary);
            margin-bottom: 0.5rem;
        }

        .submit-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-top: 1rem;
        }

        .notes-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            margin-bottom: 1rem;
            resize: vertical;
            min-height: 80px;
        }

        .notes-input:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <header class="checklist-header">
        <div class="container">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <a href="{{ url_for('chw_dashboard') }}" class="btn btn-ghost">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h1 style="font-size: 1.25rem;">Screening Checklist</h1>
                <div style="width: 40px;"></div>
            </div>
        </div>
    </header>

    <main style="padding: 1.5rem 0;">
        <div class="container">
            <!-- Tabs -->
            <div class="checklist-tabs">
                <button class="tab-btn active" onclick="showTab('maternal')">
                    <i class="fas fa-female"></i> Maternal
                </button>
                <button class="tab-btn" onclick="showTab('child')">
                    <i class="fas fa-baby"></i> Child
                </button>
                <button class="tab-btn" onclick="showTab('general')">
                    <i class="fas fa-notes-medical"></i> General
                </button>
            </div>

            <!-- Progress -->
            <div class="progress-text">Progress: <span id="progressCount">0</span> / <span id="totalCount">0</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>

            <!-- Maternal Checklist -->
            <div class="checklist-section active" id="maternal">
                <div class="checklist-card">
                    {% for item in checklists.maternal %}
                    <div class="checklist-item">
                        <div class="checkbox-custom" onclick="toggleCheck(this)">
                            <i class="fas fa-check"></i>
                        </div>
                        <span class="item-text">{{ item }}</span>
                        <select class="severity-select">
                            <option value="">--</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                            <option value="unsure">Unsure</option>
                        </select>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Child Checklist -->
            <div class="checklist-section" id="child">
                <div class="checklist-card">
                    {% for item in checklists.child %}
                    <div class="checklist-item">
                        <div class="checkbox-custom" onclick="toggleCheck(this)">
                            <i class="fas fa-check"></i>
                        </div>
                        <span class="item-text">{{ item }}</span>
                        <select class="severity-select">
                            <option value="">--</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                            <option value="unsure">Unsure</option>
                        </select>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- General Checklist -->
            <div class="checklist-section" id="general">
                <div class="checklist-card">
                    {% for item in checklists.general %}
                    <div class="checklist-item">
                        <div class="checkbox-custom" onclick="toggleCheck(this)">
                            <i class="fas fa-check"></i>
                        </div>
                        <span class="item-text">{{ item }}</span>
                        <select class="severity-select">
                            <option value="">--</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                            <option value="unsure">Unsure</option>
                        </select>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- Submit Section -->
            <div class="submit-section">
                <label style="font-weight: 600; margin-bottom: 0.5rem; display: block;">Additional Notes</label>
                <textarea class="notes-input" placeholder="Add any observations or concerns..."></textarea>
                <button class="btn btn-primary" style="width: 100%;" onclick="submitChecklist()">
                    <i class="fas fa-paper-plane"></i> Submit for Doctor Review
                </button>
            </div>
        </div>
    </main>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.checklist-section').forEach(sec => sec.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            updateProgress();
        }

        function toggleCheck(el) {
            el.classList.toggle('checked');
            el.nextElementSibling.classList.toggle('completed');
            updateProgress();
        }

        function updateProgress() {
            const activeSection = document.querySelector('.checklist-section.active');
            const total = activeSection.querySelectorAll('.checkbox-custom').length;
            const checked = activeSection.querySelectorAll('.checkbox-custom.checked').length;

            document.getElementById('progressCount').textContent = checked;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressFill').style.width = (checked / total * 100) + '%';
        }

        function submitChecklist() {
            const notes = document.querySelector('.notes-input').value;
            alert('Checklist submitted for doctor review!');
            window.location.href = '{{ url_for("chw_dashboard") }}';
        }

        // Initialize
        updateProgress();
    </script>
</body>

</html>
