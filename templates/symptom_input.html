{% extends "base.html" %}

{% block title %}Report Symptoms | Pristin Healthcare{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
        padding-bottom: 4rem;
    }

    .form-header {
        text-align: center;
        margin-bottom: 3rem;
        animation: fadeIn 0.6s ease;
    }

    .form-icon {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: rgba(59, 130, 246, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        color: var(--primary);
        margin: 0 auto 1.5rem auto;
    }

    .glass-form {
        padding: 3rem;
        animation: fadeIn 0.8s ease;
    }

    .form-group {
        margin-bottom: 2rem;
    }

    .form-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        margin-bottom: 0.75rem;
        font-size: 1rem;
    }

    .form-control {
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 14px;
        color: var(--text-primary);
        padding: 1rem 1.25rem;
        font-size: 1rem;
        transition: all 0.2s;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.05);
    }

    /* Severity Radio Styling */
    .severity-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
    }

    .severity-card {
        cursor: pointer;
        padding: 1.5rem;
        border-radius: 16px;
        text-align: center;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        transition: 0.3s;
    }

    .severity-card input {
        display: none;
    }

    .severity-card:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    .severity-card.active {
        border-color: var(--primary);
        background: rgba(59, 130, 246, 0.1);
        transform: translateY(-2px);
    }

    .s-icon {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
        display: block;
    }

    .s-label {
        font-weight: 700;
        font-size: 0.9rem;
    }

    /* Media sections */
    .media-section {
        margin-top: 2rem;
        border-top: 1px solid var(--border);
        padding-top: 2rem;
    }

    .upload-area {
        border: 2px dashed var(--border);
        border-radius: 20px;
        padding: 3rem;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
    }

    .upload-area:hover {
        border-color: var(--primary);
        background: rgba(59, 130, 246, 0.02);
    }

    .camera-box {
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <div class="form-icon"><i class="fas fa-notes-medical"></i></div>
        <h1 data-i18n="Describe Symptoms" style="font-weight: 900; font-size: 2.5rem; letter-spacing: -1px;">Describe
            Your Symptoms</h1>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;"
            data-i18n="Provide details for accurate AI recommendations">Provide details for accurate AI recommendations
        </p>
    </div>

    <form action="{{ url_for('new_symptom_report') }}" method="POST" enctype="multipart/form-data"
        class="glass-card glass-form">
        <div class="form-group">
            <label class="form-label">
                <span data-i18n="What symptoms are you experiencing?">Symptoms Description</span>
                <button type="button" class="btn-primary" id="micBtn"
                    style="padding: 6px 12px; font-size: 0.8rem; border-radius: 8px;">
                    <i class="fas fa-microphone"></i> <span data-i18n="Voice">Voice</span>
                </button>
            </label>
            <textarea name="symptom_description" id="symptomDescription" class="form-control" rows="5"
                placeholder="Describe how you feel..." required></textarea>
            <div id="micStatus"
                style="font-size: 0.8rem; color: var(--primary); margin-top: 10px; display: none; font-weight: 600;">
                <i class="fas fa-circle-notch fa-spin"></i> <span id="micStatusText">Listening...</span>
            </div>
        </div>

        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
            <div class="form-group" style="margin: 0;">
                <label class="form-label" data-i18n="Affected Body Area">Affected Area</label>
                <select name="affected_area" class="form-control">
                    <option value="head">Head / Face</option>
                    <option value="chest">Chest</option>
                    <option value="abdomen">Abdomen</option>
                    <option value="back">Back</option>
                    <option value="skin">Skin</option>
                    <option value="general">Whole Body</option>
                </select>
            </div>
            <div class="form-group" style="margin: 0;">
                <label class="form-label" data-i18n="Duration">Duration</label>
                <input type="text" name="duration" class="form-control" placeholder="e.g. 2 days">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" data-i18n="Severity">Severity</label>
            <div class="severity-options">
                <label class="severity-card" onclick="updateSeverity(this)">
                    <input type="radio" name="severity" value="mild">
                    <span class="s-icon"><i class="fas fa-smile" style="color: var(--success);"></i></span>
                    <span class="s-label" data-i18n="Mild">Mild</span>
                </label>
                <label class="severity-card active" onclick="updateSeverity(this)">
                    <input type="radio" name="severity" value="moderate" checked>
                    <span class="s-icon"><i class="fas fa-meh" style="color: var(--warning);"></i></span>
                    <span class="s-label" data-i18n="Moderate">Moderate</span>
                </label>
                <label class="severity-card" onclick="updateSeverity(this)">
                    <input type="radio" name="severity" value="severe">
                    <span class="s-icon"><i class="fas fa-frown" style="color: var(--error);"></i></span>
                    <span class="s-label" data-i18n="Severe">Severe</span>
                </label>
            </div>
        </div>

        <div class="media-section">
            <div class="flex justify-between items-center mb-4">
                <label class="form-label" data-i18n="Upload Photo (Optional)" style="margin: 0;">Related Photo</label>
                <div class="flex gap-2">
                    <button type="button" class="btn-primary" id="useUpload"
                        style="padding: 6px 14px; font-size: 0.8rem; background: var(--bg-glass);">Upload</button>
                    <button type="button" class="btn-primary" id="useCamera"
                        style="padding: 6px 14px; font-size: 0.8rem; background: var(--bg-glass);">Camera</button>
                </div>
            </div>

            <div id="uploadContainer">
                <label class="upload-area" id="dropArea">
                    <input type="file" name="symptom_image" id="fileInput" hidden accept="image/*">
                    <i class="fas fa-cloud-upload-alt"
                        style="font-size: 2.5rem; color: var(--text-secondary); margin-bottom: 1rem;"></i>
                    <p style="color: var(--text-secondary); font-weight: 600;">Tap to upload or drag & drop</p>
                    <img id="previewImg" style="display: none; max-width: 100%; border-radius: 12px; margin-top: 1rem;">
                </label>
            </div>

            <div id="cameraContainer" style="display: none;">
                <div class="camera-box">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <img id="capturedImg" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="flex justify-center gap-4 mt-4">
                    <button type="button" class="btn-primary" id="captureBtn"><i class="fas fa-camera"></i>
                        Capture</button>
                    <button type="button" class="btn-primary" id="retakeBtn" style="display: none;"><i
                            class="fas fa-redo"></i> Retake</button>
                </div>
                <input type="hidden" name="camera_image" id="cameraData">
            </div>
        </div>

        <button type="submit" class="btn-primary w-full"
            style="justify-content: center; width: 100%; padding: 1.25rem; font-size: 1.1rem; margin-top: 3rem;">
            <span data-i18n="Submit & Get Recommendations">Analyze Symptoms</span> <i class="fas fa-magic"
                style="margin-left: 10px;"></i>
        </button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function updateSeverity(el) {
        document.querySelectorAll('.severity-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
    }

    // Camera & Upload Logic
    const useUpload = document.getElementById('useUpload');
    const useCamera = document.getElementById('useCamera');
    const uploadCont = document.getElementById('uploadContainer');
    const cameraCont = document.getElementById('cameraContainer');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const capturedImg = document.getElementById('capturedImg');
    const cameraData = document.getElementById('cameraData');

    let stream = null;

    useUpload.onclick = () => {
        uploadCont.style.display = 'block';
        cameraCont.style.display = 'none';
        stopCamera();
    };

    useCamera.onclick = async () => {
        uploadCont.style.display = 'none';
        cameraCont.style.display = 'block';
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
        } catch (e) { alert("Camera access denied"); }
    };

    function stopCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
    }

    captureBtn.onclick = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const data = canvas.toDataURL('image/jpeg');
        cameraData.value = data;
        capturedImg.src = data;
        capturedImg.style.display = 'block';
        video.style.display = 'none';
        captureBtn.style.display = 'none';
        retakeBtn.style.display = 'inline-flex';
    };

    retakeBtn.onclick = () => {
        capturedImg.style.display = 'none';
        video.style.display = 'block';
        captureBtn.style.display = 'inline-flex';
        retakeBtn.style.display = 'none';
        cameraData.value = '';
    };

    // Speech Recognition
    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('micStatus');
    const desc = document.getElementById('symptomDescription');
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRec) {
        const rec = new SpeechRec();
        rec.onstart = () => { status.style.display = 'block'; micBtn.style.background = 'var(--error)'; };
        rec.onend = () => { status.style.display = 'none'; micBtn.style.background = ''; };
        rec.onresult = (e) => { desc.value += (desc.value ? ' ' : '') + e.results[0][0].transcript; };
        micBtn.onclick = () => rec.start();
    } else { micBtn.style.display = 'none'; }
</script>
{% endblock %}
