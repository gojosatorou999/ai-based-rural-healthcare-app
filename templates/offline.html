<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#C4FF0D">
    <title>Offline - Rural Telemedicine</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        .offline-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .offline-content {
            max-width: 500px;
        }

        .offline-icon {
            font-size: 6rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            animation: pulse 2s ease infinite;
        }

        .offline-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .offline-text {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .offline-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div class="offline-container">
        <div class="offline-content">
            <div class="offline-icon">
                <i class="fas fa-wifi-slash"></i>
            </div>

            <h1 class="offline-title">You're Offline</h1>

            <p class="offline-text">
                No internet connection detected. Don't worry, you can still access previously loaded content and submit
                data when you're back online.
            </p>

            <div class="offline-actions">
                <button onclick="window.location.reload()" class="btn btn-primary">
                    <i class="fas fa-sync"></i>
                    Try Again
                </button>
                <a href="/" class="btn btn-secondary">
                    <i class="fas fa-home"></i>
                    Go Home
                </a>
            </div>

            <div class="mt-xl">
                <div class="alert alert-info" style="display: inline-block; text-align: left;">
                    <i class="fas fa-info-circle"></i>
                    <div>
                        <strong>Offline Features:</strong>
                        <ul style="margin: 0.5rem 0 0 1.25rem;">
                            <li>View previously loaded data</li>
                            <li>Submit symptoms (syncs later)</li>
                            <li>Log vitals (syncs later)</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-retry when online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>

</html>
