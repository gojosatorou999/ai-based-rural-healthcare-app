<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Disease Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h1 class="text-primary">🔬 Eye Disease Detection</h1>
        <p class="lead">Upload an eye image to check for diseases.</p>

        <form action="{{ url_for('upload_image') }}" method="POST" enctype="multipart/form-data" class="mt-4">
            <input type="file" name="image" class="form-control mb-3" required>
            <button type="submit" class="btn btn-success">Analyze Image</button>
        </form>

        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-3">⬅️ Back to Dashboard</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
