<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h1 class="text-success">✅ Analysis Complete</h1>
        <p class="lead">Here is the result of your eye scan:</p>

        <div class="card mx-auto mt-4 shadow-lg" style="max-width: 22rem;">
            <img src="{{ image_url }}" class="card-img-top rounded" alt="Uploaded Eye Scan">
            <div class="card-body">
                <h5 class="card-title text-danger">Prediction: <strong>{{ result }}</strong></h5>
                <p class="text-muted">This is an AI-based analysis. Please consult a doctor for confirmation.</p>
            </div>
        </div>

        <form action="{{ url_for('upload_image') }}" method="post" enctype="multipart/form-data" class="mt-4">
            <input type="file" name="image" accept="image/*" required class="form-control w-50 mx-auto">
            <button type="submit" class="btn btn-primary mt-3">🔄 Try Another Image</button>
        </form>

        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-3">⬅️ Back to Dashboard</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
