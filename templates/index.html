<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Eye Disease Scanner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h1 class="text-primary">👁 AI Eye Disease Scanner</h1>
        <p class="lead">Upload an image or take a photo to scan for diseases.</p>

        <!-- File Upload -->
        <form id="upload-form" class="mt-3">
            <input type="file" id="imageInput" name="image" class="form-control mb-2">
            <button type="submit" class="btn btn-primary">📤 Upload & Scan</button>
        </form>

        <!-- Camera Capture -->
        <div class="mt-4">
            <h3>📷 Capture From Camera</h3>
            <video id="video" width="320" height="240" autoplay></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <button id="capture" class="btn btn-success mt-2">📸 Capture</button>
        </div>

        <!-- Scan Result -->
        <div id="result-section" class="mt-4 p-3 bg-white shadow-sm rounded" style="display: none;">
            <h4>🔍 Scan Result: <span id="disease-result" class="text-danger"></span></h4>
            <h5>🔬 Confidence: <span id="confidence-score"></span>%</h5>
            <img id="result-image" class="img-thumbnail mt-2" width="200">
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureButton = document.getElementById('capture');

        // Access the camera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => console.error("Camera Access Denied:", err));

        captureButton.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                let formData = new FormData();
                formData.append('image', blob, 'blob');  // Send as 'blob' to Flask

                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result-section').style.display = 'block';
                    document.getElementById('disease-result').innerText = data.result;
                    document.getElementById('confidence-score').innerText = data.confidence;
                    document.getElementById('result-image').src = data.image_url;
                })
                .catch(error => console.error('Error:', error));
            }, 'image/png');
        });

        // Handle file upload form
        document.getElementById('upload-form').addEventListener('submit', event => {
            event.preventDefault();
            let formData = new FormData(event.target);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result-section').style.display = 'block';
                document.getElementById('disease-result').innerText = data.result;
                document.getElementById('confidence-score').innerText = data.confidence;
                document.getElementById('result-image').src = data.image_url;
            })
            .catch(error => console.error('Error:', error));
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
