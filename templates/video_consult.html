<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Consultation - Pristin Healthcare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .video-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
        }

        .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
            /* Placeholder effect */
        }

        .remote-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            z-index: 0;
        }

        .local-video {
            position: absolute;
            bottom: 120px;
            right: 20px;
            width: 160px;
            height: 120px;
            background: #000;
            border-radius: var(--radius-md);
            border: 2px solid var(--primary);
            object-fit: cover;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .video-controls {
            height: 80px;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .btn-danger {
            background: #ef4444;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-active {
            background: #fff;
            color: #000;
        }

        .call-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            color: #fff;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 10;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="video-container">
        <!-- Call Info -->
        <div class="call-info">
            <span class="status-dot"></span>
            <span>Room: {{ room_id }}</span>
            <span style="opacity: 0.5;">•</span>
            <span id="timer">00:00</span>
        </div>

        <!-- Remote Video (Placeholder) -->
        <div class="remote-placeholder">
            <i class="fas fa-user-md" style="font-size: 3rem; margin-bottom: 1rem;"></i>
            <h3>Waiting for doctor...</h3>
            <p>Your unique room ID is {{ room_id }}</p>
        </div>
        <!-- Remote Video -->
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>

        <!-- Local Video -->
        <video id="localVideo" class="local-video" autoplay playsinline muted></video>
    </div>

    <!-- Controls -->
    <div class="video-controls">
        <button class="control-btn" id="micBtn" onclick="toggleMic()">
            <i class="fas fa-microphone"></i>
        </button>
        <button class="control-btn" id="camBtn" onclick="toggleCam()">
            <i class="fas fa-video"></i>
        </button>
        <button class="control-btn btn-danger" onclick="endCall()">
            <i class="fas fa-phone-slash"></i>
        </button>
        <button class="control-btn" onclick="shareScreen()">
            <i class="fas fa-desktop"></i>
        </button>
        <button class="control-btn" onclick="toggleChat()">
            <i class="fas fa-comment"></i>
        </button>
    </div>

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        const roomID = "{{ room_id }}";
        const userRole = "{{ current_user.role }}"; // 'doctor', 'chw', 'patient'

        // Determine Peer IDs
        // Doctor/CHW acts as the "Host" (suffix: -doc)
        // Patient acts as the "Guest" (suffix: -pat)
        const isDoctor = ['doctor', 'chw'].includes(userRole);

        const myPeerID = `pristin-${roomID}-${isDoctor ? 'doc' : 'pat'}`;
        const targetPeerID = `pristin-${roomID}-${isDoctor ? 'pat' : 'doc'}`;

        let peer;
        let conn;
        let localStream;
        let currentCall;
        let isAudioMuted = false;
        let isVideoOff = false;
        let seconds = 0;
        let timerInterval;

        // Initialize
        async function init() {
            try {
                // 1. Get Local Stream
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720, facingMode: "user" },
                    audio: true
                });
                document.getElementById('localVideo').srcObject = localStream;
                updateStatus("Initializing connection...", "warning");

                // 2. Initialize Peer
                peer = new Peer(myPeerID, {
                    debug: 2
                });

                peer.on('open', (id) => {
                    console.log('My peer ID is: ' + id);
                    updateStatus(`Waiting for ${isDoctor ? 'patient' : 'doctor'}...`, "info");

                    // Attempt to call the other side continuously until connected
                    connectToPeer();
                });

                peer.on('call', (call) => {
                    console.log("Incoming call...");
                    // Answer the call with our stream
                    call.answer(localStream);
                    handleCall(call);
                });

                peer.on('error', (err) => {
                    console.error(err);
                    if (err.type === 'peer-unavailable') {
                        // Peer not found, just keep waiting/retrying
                        console.log("Peer not found yet.");
                    } else if (err.type === 'unavailable-id') {
                        alert("Room already active! Only one doctor and one patient allowed.");
                    }
                });

            } catch (err) {
                console.error("Failed to get local stream", err);
                alert("Camera/Microphone access denied. Please allow permissions.");
            }
        }

        // Connect to the target peer
        function connectToPeer() {
            if (currentCall) return; // Already in a call

            console.log(`Attempting to call ${targetPeerID}...`);
            const call = peer.call(targetPeerID, localStream);

            // If the call initializes (peer exists), handle it
            if (call) {
                handleCall(call);
            } else {
                // Retry in 3 seconds
                setTimeout(connectToPeer, 3000);
            }
        }

        // Handle a call (incoming or outgoing)
        function handleCall(call) {
            if (currentCall) return; // Already handled
            currentCall = call;

            call.on('stream', (remoteStream) => {
                const remoteVideo = document.getElementById('remoteVideo');
                // Only set if not already set to avoid flickering
                if (remoteVideo.srcObject !== remoteStream) {
                    remoteVideo.srcObject = remoteStream;
                    document.querySelector('.remote-placeholder').style.display = 'none';
                    updateStatus("Connected", "success");
                    startTimer();
                }
            });

            call.on('close', () => {
                endCallUI();
            });

            call.on('error', (err) => {
                console.error("Call error:", err);
                endCallUI();
            });
        }

        function endCallUI() {
            document.getElementById('remoteVideo').srcObject = null;
            document.querySelector('.remote-placeholder').style.display = 'block';
            updateStatus("Call Ended", "danger");
            stopTimer();
            currentCall = null;
            // Try to reconnect?
            setTimeout(connectToPeer, 2000);
        }

        function updateStatus(msg, type) {
            const statusBadge = document.querySelector('.call-info');
            const statusDot = statusBadge.querySelector('.status-dot');
            statusBadge.querySelector('span:nth-child(2)').textContent = msg;

            statusDot.style.background = type === 'success' ? 'var(--success)' :
                type === 'warning' ? 'var(--warning)' :
                    type === 'danger' ? 'var(--error)' : '#fff';
        }

        // Timer
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('timer').textContent =
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer').textContent = "00:00";
        }

        // Controls
        function toggleMic() {
            isAudioMuted = !isAudioMuted;
            if (localStream) localStream.getAudioTracks()[0].enabled = !isAudioMuted;
            const btn = document.getElementById('micBtn');
            btn.innerHTML = isAudioMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
            btn.classList.toggle('btn-danger', isAudioMuted);
        }

        function toggleCam() {
            isVideoOff = !isVideoOff;
            if (localStream) localStream.getVideoTracks()[0].enabled = !isVideoOff;
            const btn = document.getElementById('camBtn');
            btn.innerHTML = isVideoOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
            btn.classList.toggle('btn-danger', isVideoOff);
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (peer) peer.destroy();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            window.location.href = "{{ url_for('dashboard') }}";
        }

        function shareScreen() {
            // Basic screen share implementation
            navigator.mediaDevices.getDisplayMedia({ video: true })
                .then(screenStream => {
                    const videoTrack = screenStream.getVideoTracks()[0];
                    if (currentCall && currentCall.peerConnection) {
                        const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                        sender.replaceTrack(videoTrack);

                        videoTrack.onended = () => {
                            sender.replaceTrack(localStream.getVideoTracks()[0]);
                        };
                    }
                })
                .catch(err => console.error("Screen share error:", err));
        }

        function toggleChat() {
            alert("Chat feature linked to consultation notes in Pro version");
        }

        // Start
        window.addEventListener('load', init);
    </script>
</body>

</html>
