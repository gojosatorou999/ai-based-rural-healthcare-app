<!DOCTYPE html>
<html lang="{{ session.get('lang', 'en') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Video Consultation' | translate }} | Pristin Healthcare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --bg: #030711;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .video-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #111827 0%, #030711 100%);
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transition: opacity 1s ease;
        }

        .placeholder-ui {
            text-align: center;
            z-index: 5;
        }

        .pulse-icon {
            font-size: 4rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            100% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }

        #localVideo {
            position: absolute;
            bottom: 110px;
            right: 25px;
            width: 200px;
            height: 130px;
            border-radius: 20px;
            background: black;
            border: 2px solid var(--border);
            object-fit: cover;
            z-index: 20;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.3s;
        }

        .top-shelf {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
        }

        .glass-pill {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        .control-hub {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            padding: 12px 25px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 40;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .btn-round {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-round:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .btn-round.active {
            background: white;
            color: black;
        }

        .btn-end {
            background: #ef4444 !important;
            width: 64px;
            height: 54px;
            border-radius: 18px;
        }

        .btn-end:hover {
            background: #dc2626 !important;
            transform: scale(1.05) translateY(-2px);
        }

        .signaling-output {
            position: absolute;
            bottom: 120px;
            left: 25px;
            width: 320px;
            max-height: 200px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #10b981;
            overflow-y: auto;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: none;
            z-index: 100;
        }
    </style>
</head>

<body>
    <div class="video-stage">
        <!-- Overlay UI -->
        <div class="top-shelf">
            <div class="glass-pill">
                <div class="live-dot"></div>
                <span id="callStatusText">{{ 'Connecting...' | translate }}</span>
                <span style="opacity: 0.3;">|</span>
                <span id="timer">00:00</span>
            </div>
            <div class="glass-pill">
                <i class="fas fa-lock" style="color: #10b981;"></i>
                <span>Room: {{ room_id }}</span>
            </div>
        </div>

        <!-- Waiting State -->
        <div class="placeholder-ui" id="placeholderUI">
            <i class="fas fa-hand-holding-medical pulse-icon"></i>
            <h2 style="font-weight: 800; font-size: 2rem; margin: 0;">{% if current_user.role == 'doctor' %}Clinical
                Presence Required{% else %}Consultant Incoming{% endif %}</h2>
            <p style="opacity: 0.6; margin-top: 10px;">{{ 'Your secure channel' | translate }} #{{ room_id }} {{ 'is
                active.' | translate }}</p>
            <button onclick="startCalling()"
                style="margin-top: 30px; padding: 14px 28px; border-radius: 14px; background: var(--primary-gradient); color: white; border: none; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);">
                <i class="fas fa-video"></i> {{ 'Establish Connection' | translate }}
            </button>
        </div>

        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>

        <!-- Dynamic Controls -->
        <div class="control-hub">
            <button id="micBtn" class="btn-round" onclick="toggleMic()" title="Mic">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="camBtn" class="btn-round" onclick="toggleCam()" title="Camera">
                <i class="fas fa-video"></i>
            </button>
            <button class="btn-round btn-end" onclick="endCall()" title="End">
                <i class="fas fa-phone-slash"></i>
            </button>
            <button class="btn-round" onclick="shareScreen()" title="Screen">
                <i class="fas fa-desktop"></i>
            </button>
            <button class="btn-round" onclick="toggleConsole()" title="Debug">
                <i class="fas fa-terminal"></i>
            </button>
        </div>

        <div id="signalingConsole" class="signaling-output"></div>
    </div>

    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const roomID = "{{ room_id }}";
        const userRole = "{{ current_user.role }}";
        const isDoctor = ['doctor', 'chw'].includes(userRole);
        const myPeerID = `pristin-${roomID}-${isDoctor ? 'doc' : 'pat'}`.toLowerCase();
        const targetPeerID = `pristin-${roomID}-${isDoctor ? 'pat' : 'doc'}`.toLowerCase();

        let peer, localStream, currentCall, isConnected = false, isAudioMuted = false, isVideoOff = false, seconds = 0, timerInterval, callInterval;

        function log(msg) {
            const el = document.getElementById('signalingConsole');
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        }

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });
                document.getElementById('localVideo').srcObject = localStream;
                initializePeer();
            } catch (err) {
                alert("Hardware Access Denied: " + err.message);
            }
        }

        function initializePeer() {
            peer = new Peer(myPeerID, {
                debug: 2,
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                log("ID Verified: " + id);
                document.getElementById('callStatusText').textContent = "{{ 'Waiting...' | translate }}";
                startCalling();
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                handleCall(call);
            });
        }

        function startCalling() {
            if (callInterval) clearInterval(callInterval);
            callInterval = setInterval(() => {
                if (!isConnected && peer && !peer.disconnected) {
                    const call = peer.call(targetPeerID, localStream);
                    if (call) handleCall(call);
                } else {
                    clearInterval(callInterval);
                }
            }, 3000);
        }

        function handleCall(call) {
            currentCall = call;
            call.on('stream', (stream) => {
                const remote = document.getElementById('remoteVideo');
                if (remote.srcObject !== stream) {
                    remote.srcObject = stream;
                    document.getElementById('placeholderUI').style.display = 'none';
                    remote.style.display = 'block';
                    isConnected = true;
                    document.getElementById('callStatusText').textContent = "{{ 'Encrypted Live' | translate }}";
                    startTimer();
                }
            });
            call.on('close', handleCallEnd);
        }

        function handleCallEnd() {
            isConnected = false;
            document.getElementById('remoteVideo').style.display = 'none';
            document.getElementById('placeholderUI').style.display = 'block';
            document.getElementById('callStatusText').textContent = "{{ 'Call Disconnected' | translate }}";
            stopTimer();
            startCalling();
        }

        function startTimer() {
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function toggleMic() {
            isAudioMuted = !isAudioMuted;
            localStream.getAudioTracks()[0].enabled = !isAudioMuted;
            document.getElementById('micBtn').classList.toggle('active', isAudioMuted);
            document.getElementById('micBtn').innerHTML = isAudioMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
        }

        function toggleCam() {
            isVideoOff = !isVideoOff;
            localStream.getVideoTracks()[0].enabled = !isVideoOff;
            document.getElementById('camBtn').classList.toggle('active', isVideoOff);
            document.getElementById('camBtn').innerHTML = isVideoOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
        }

        function endCall() {
            window.location.href = "{{ url_for('dashboard') }}";
        }

        function toggleConsole() {
            const el = document.getElementById('signalingConsole');
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function shareScreen() {
            navigator.mediaDevices.getDisplayMedia({ video: true }).then(s => {
                const track = s.getVideoTracks()[0];
                const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                sender.replaceTrack(track);
                track.onended = () => sender.replaceTrack(localStream.getVideoTracks()[0]);
            });
        }

        window.onload = init;
    </script>
</body>

</html>
