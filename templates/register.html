{% extends "base.html" %}

{% block title %}Create Account | Pristin Healthcare{% endblock %}

{% block extra_css %}
<style>
    .auth-stage {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        padding: 4rem 0;
    }

    .auth-box {
        width: 100%;
        max-width: 520px;
        padding: 3.5rem;
    }

    .auth-lead {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .auth-lead h1 {
        font-size: 2.25rem;
        font-weight: 900;
        letter-spacing: -1.5px;
        margin-bottom: 8px;
    }

    .auth-lead p {
        color: var(--text-secondary);
        font-weight: 500;
        font-size: 0.95rem;
    }

    .inp-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
    }

    .inp-group {
        margin-bottom: 1.25rem;
    }

    .inp-label {
        display: block;
        font-size: 0.725rem;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 6px;
        letter-spacing: 0.5px;
    }

    .inp-wrap {
        position: relative;
    }

    .inp-field {
        width: 100%;
        height: 52px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0 1.25rem 0 2.75rem;
        color: var(--text-primary);
        font-size: 0.95rem;
        transition: all 0.2s;
        outline: none;
    }

    .inp-field:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.05);
    }

    .inp-icon {
        position: absolute;
        left: 1.1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    select.inp-field {
        appearance: none;
    }

    .auth-nav {
        margin-top: 2.5rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-secondary);
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
    }

    .auth-nav a {
        color: var(--primary);
        font-weight: 800;
        text-decoration: none;
    }

    @media (max-width: 640px) {
        .inp-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-stage animate">
    <div class="glass-card auth-box">
        <div class="auth-lead">
            <h1 data-i18n="Create Account">Create Account</h1>
            <p data-i18n="Join the Pristin health network today.">Join the Pristin health network today.</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="inp-group">
                <label class="inp-label" data-i18n="Full Name">Full Name</label>
                <div class="inp-wrap">
                    <i class="fas fa-user-tag inp-icon"></i>
                    <input type="text" name="username" class="inp-field" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="inp-group">
                <label class="inp-label" data-i18n="Email Address">Email Address</label>
                <div class="inp-wrap">
                    <i class="fas fa-at inp-icon"></i>
                    <input type="email" name="email" class="inp-field" placeholder="yourname@email.com" required>
                </div>
            </div>

            <div class="inp-grid">
                <div class="inp-group">
                    <label class="inp-label" data-i18n="Age">Age</label>
                    <div class="inp-wrap">
                        <i class="fas fa-calendar-day inp-icon"></i>
                        <input type="number" name="age" class="inp-field" placeholder="Years">
                    </div>
                </div>
                <div class="inp-group">
                    <label class="inp-label" data-i18n="Gender">Gender</label>
                    <div class="inp-wrap">
                        <i class="fas fa-venus-mars inp-icon"></i>
                        <select name="gender" class="inp-field">
                            <option value="male" data-i18n="Male">Male</option>
                            <option value="female" data-i18n="Female">Female</option>
                            <option value="other" data-i18n="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="inp-group">
                <label class="inp-label" data-i18n="Designated Role">Designated Role</label>
                <div class="inp-wrap">
                    <i class="fas fa-user-gear inp-icon"></i>
                    <select name="role" class="inp-field">
                        <option value="patient" data-i18n="Patient">Patient</option>
                        <option value="doctor" data-i18n="Medical Doctor">Medical Doctor</option>
                        <option value="chw" data-i18n="Health Worker">Health Worker</option>
                    </select>
                </div>
            </div>

            <div class="inp-group">
                <label class="inp-label" data-i18n="Password">Password</label>
                <div class="inp-wrap">
                    <i class="fas fa-lock inp-icon"></i>
                    <input type="password" name="password" class="inp-field" placeholder="Choose a secure password" required>
                </div>
            </div>

            <button type="submit" class="btn-primary"
                style="width: 100%; height: 52px; border-radius: 14px; justify-content: center; font-size: 1rem; margin-top: 1rem;">
                <span data-i18n="Create Account">Create Account</span> <i class="fas fa-user-plus"
                    style="margin-left: 10px;"></i>
            </button>
        </form>

        <div class="auth-nav">
            <span data-i18n="Already have an account?">Already have an account?</span>
            <a href="{{ url_for('login') }}" data-i18n="Sign In">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const items = document.querySelectorAll('.animate');
        items.forEach((item, index) => {
            setTimeout(() => {
                item.style.animation = `fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards`;
            }, index * 60);
        });
    });
</script>
{% endblock %}
